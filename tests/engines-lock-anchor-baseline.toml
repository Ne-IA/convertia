# tests/engines-lock-anchor-baseline.toml — the anchor-baseline shape (P4.56.1).
#
# The §3.8 mixed-mode case: one component PREBUILT on one triple and compiled FROM SOURCE on two
# others. It takes THREE rows of one id to expose the bug this fixture pins, which is why neither of
# the other fixtures caught it — the prebuilt row sorts first and carries no anchor, so a comparison
# baselined on "row 0 of this id" finds nothing to compare and silently no-ops for the two from-source
# siblings behind it. Their `tarball_sha256` values diverge here (`aaaa…` vs `bbbb…`) even though both
# rows name the same `source_ref`, which is impossible: one signed source tarball has one hash. That is
# the xz-class provenance drift the comparison exists to catch, and it must be caught regardless of
# which mode happens to appear first.
#
# So the anchor comparison is baselined on the first sibling that actually HAS an anchor, tracked
# separately from the string-field baseline. Since the 2026-09-01 (A′) mode-scoping follow-up that
# baseline is keyed on the SOURCE URL rather than on the cache group — same source ⇒ same anchors,
# the one law that holds in both modes. This fixture still exercises it because all three rows name
# ONE `upstream_url`; a from-source group spanning SEVERAL sources is covered in
# `crate::engines::lock`'s test module instead (the module is the anchor - a `#[test] fn` name is
# not a reference anything resolves, so it would rot silently on a rename).

[[engine]]
id = "libmp3lame"
version = "3.100"
source_ref = "3.100"
triples = ["x86_64-pc-windows-msvc"]
kind = "staged-artifact"
upstream_url = "https://downloads.sourceforge.net/lame/lame-3.100.tar.gz"
licence = "LGPL-2.0-or-later"
linkage = "linked"
acquisition = "prebuilt"
purl = "pkg:generic/lame@3.100"
sha256 = "1010101010101010101010101010101010101010101010101010101010101010"
asset_sha256 = "cccc0000cccc0000cccc0000cccc0000cccc0000cccc0000cccc0000cccc0000"
prebuilt_corroboration = "mirrors"
corroboration_urls = [
  "https://lame.sourceforge.io/download.php",
  "https://sources.debian.org/src/lame/3.100-6/",
]

