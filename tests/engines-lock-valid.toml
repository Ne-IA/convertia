# tests/engines-lock-valid.toml — the §3.7.2 `engines.lock` SCHEMA fixture (P4.56.1).
#
# NOT the committed manifest: `src-tauri/engines.lock` is L(-1)-caged and its real rows land with the
# P5–P7 staging boxes as owner-acked acts. This file exists so the schema contract is proved against the
# FORMAT the manifest is written in — a missing key, a typo'd key and a mis-shaped availability value are
# all parse-level facts a hand-built fixture struct could not exercise. The `crate::engines::lock` tests
# read it with `include_str!` and derive their malformed cases from it by unique-anchor substitution.
#
# It exercises all four row shapes the §3.4.4a row-law admits:
#   1. a per-triple staged artifact carrying the scalar `available` flag (the x265 codec case),
#   2. a second row for the SAME artifact on a different triple — the (artifact, triple) key at work,
#   3. a byte-identical platform-invariant artifact as ONE row over several triples (a bundled font),
#   4. a sub-component row (§3.7.2 item 4) whose hash anchors the pinned SOURCE, not a staged file.
#
# The libimagequant row's `upstream_url` is a bare REPO ROOT, which `EngineRow::upstream_url`'s doc
# asks a real pin not to be (since the (A′) follow-up that field is the KEY of the anchor rule, so a
# landing page shared by two components pinned at different commits would force one anchor on both).
# It is deliberate here: nothing enforces the shape yet, and this is the row the URL-keying tests
# mutate precisely BECAUSE its source differs from its group siblings'. When a check for it lands,
# this row is the first thing it will flag - by design.
#
# The prebuilt font row also carries the §3.8 PREBUILT anchor set the (A′) ruling added — `asset_sha256`
# (of the DOWNLOAD, distinct from the staged `sha256`) plus `prebuilt_corroboration = "mirrors"` and the
# two independent corroboration URLs that submode requires. Every other row here is from-source and so
# carries neither, which is itself the mode split under test.
#
# The FIFTH shape — the same sub-component split across triples, sharing its source anchor — lives in
# its own fixture (`engines-lock-subcomponent-split.toml`) so this file's substitution anchors stay
# unique: a second libimagequant row here would duplicate nine of them at once. The SIXTH — several
# DIFFERENT artifacts sharing one §6.1.3 cache entry — is `engines-lock-cache-group.toml`, kept apart
# for the same anchor-uniqueness reason.

