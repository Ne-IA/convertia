# engines.lock — the §3.7.2 build manifest (the single canonical name; there is no engines.toml).
#
# The authoritative input to the release plane: every bundled engine, staged codec shared object,
# bundled security-config file and bundled font declares itself here as `[[engine]]` row(s) —
# "not hand-curated prose, so it can't drift from what actually ships" (spec §3.7.2).
#
# ROW LAW [DECIDED — owner adjudications 2026-08-31 (the row key) + 2026-09-01 (the cache group,
# the (A′) ruling + its P4.28.1 mode-scoping follow-up), spec §3.4.4a]: a row is keyed by
# (artifact, target-triple); (artifact, triple) maps to exactly one row, and one row = one
# STAGED-BYTES `sha256`. Every field is platform-pure; no field is a per-platform map ("scalar"
# admits a sub-table of scalars: [engine.from_source]). TWO fields are plural: `triples` (a
# byte-identical platform-invariant artifact — a font, policy.xml, the LibreOffice .xcu — is ONE
# row over several triples) and `corroboration_urls` (a `mirrors` cross-check needs ≥ 2,
# §3.8-(i)). The moment an ARTIFACT-identifying field forks across triples, the row splits; the
# §6.1.3 cache-GROUP fields (cache_engine / cache_version / upstream_url / asset_sha256) are NOT
# artifact-identifying — several rows ship out of ONE cache entry — and the validator holds a
# group to one `cache_version` AND one `acquisition` in EITHER mode. A PREBUILT group is one
# download, so `upstream_url` and `asset_sha256` are additionally held EQUAL across it; a
# FROM-SOURCE group is a COMPILE that may consume several signed source tarballs
# (schema-writable here since the P4.28.1 validator re-scoping; its populate path is P4.28.1's
# CI compile — `scripts/fetch-engine-assets` acquires PREBUILT rows only), held together by
# the URL-keyed anchor rule instead: rows with the same `upstream_url` carry identical
# `from_source` anchors — same source ⇒ same anchors, one law across both modes. §3.7.2 item-4
# sub-components (kind = "sub-component") follow the same law with the hash anchoring the pinned
# SOURCE.
#
# The schema + validator live in `crate::engines::lock` (src-tauri/src/engines/lock.rs, P4.56.1);
# the field-by-field contract is documented there. Consumers (verified against the spec; each
# reader lands with its named box): G37 (staged-byte SHA-256 verify, before staging AND on
# cache-restore), the §3.4.4a startup parse→map flow (P4.40), `cargo xtask sbom` (§6.3.1,
# P4.56.2), the engine-source allow-list gate (§3.8, P4.56.3 — keyed on `cache_engine`), and the
# `<cache_engine>-<cache_version>-<triple>` asset cache (§6.1.3, P4.28 — the cache key is the
# GROUP key, `EngineRow::cache_key`; never the row's own id/version).
#
# THIS FILE IS L(-1) (scripts/l-neg1-files.toml, gate G71): the autonomous Build-Loop NEVER edits
# it; every edit is an owner-acked act (`L-neg1-ack: owner`), and any SHA-256 edit is additionally
# a hard Co-Pilot escalation (§3.7.2/§6.3.4 — the pin-establishment provenance rule: a new pin's
# hash MUST be corroborated against the upstream's own published checksum/signature, with the
# corroboration source(s) recorded on the row in `corroboration_urls` — PLURAL, and the validator
# enforces the COUNT floor per `prebuilt_corroboration` submode: `mirrors` needs ≥ 2 non-blank
# URLs (§3.8-(i), mirrors-only — two build providers make two different binaries), `signed-repo`
# needs 1; a single URL on a `mirrors` pin is rejected. §3.8-(i) additionally requires the mirror
# ORIGINS to be pairwise INDEPENDENT — enforced by the P4.56.3 allow-list gate (whose Loop half
# also adds the matching distinct-host floor to the lock.rs validator; that box's pre-declared
# owner tail re-blesses this clause)).
#
# An empty manifest is VALID (`crate::engines::lock` and its empty-container test): the container
# landed at P4.56.1 and each engine's rows land with its staging box (P5–P7); the reading gates
# hold the fail-open-while-empty / fail-closed-on-first-row posture (the P4.56.3 gate semantics).
