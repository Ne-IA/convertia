# ConvertIA project-local Semgrep rule — the TS/WebView TAINT-mode ruleset (G29 rule (i)).
#
# The T2 taint control for v1 (CodeQL is not adopted, docs/process/gate-status.md); plan-lint
# check 21 asserts this file. The structural rules (a)/(f) prove the SHAPE of the IPC door, not the
# FLOW: this rule follows a WebView-controlled value (an `invoke(...)` result, or a DOM event's
# `.data`) into a dangerous DOM/eval sink within one function. The pinned Semgrep's taint mode does
# not follow a value across a function or file boundary (measured), the accepted residual of the
# gate-status.md CodeQL row.
rules:
  - id: convertia-webview-taint-to-dom-sink
    languages: [typescript]
    severity: ERROR
    mode: taint
    message: >-
      A WebView-controlled value (invoke() result or DOM event value) flows into a dangerous
      DOM/eval sink (innerHTML / outerHTML / eval / Function / document.write) without
      sanitization. This is the T2 taint flow the structural rules cannot reach.
      G29 rule (i), threat T2, spec §0.10.
    metadata:
      convertia-rule: "i"
      threat: [T2]
      references: ["build-gates.md G29 (i)", "plan-lint check 21"]
    pattern-sources:
      - pattern: invoke(...)
      - pattern: await invoke(...)
      - pattern: $E.data
    pattern-sinks:
      - pattern: $EL.innerHTML = $SINK
      - pattern: $EL.outerHTML = $SINK
      - pattern: $EL.insertAdjacentHTML($POS, $SINK)
      - pattern: eval($SINK)
      - pattern: Function($SINK)
      - pattern: document.write($SINK)
      - pattern: document.writeln($SINK)
      # React's XSS sink (the real UI is React 19): the inner object of dangerouslySetInnerHTML={{ __html: tainted }}
      - pattern: "{ __html: $SINK }"
