# ConvertIA project-local Semgrep rules — the engine argv ABSENCE rules (G29 (b2), (b3a)).
#
# Absence rules only. Engine argv is a `Vec<OsString>` built by plan(); the sole `Command::new` lives in
# `crate::isolation`, so a chain-shaped rule binds nothing here. Each rule matches a forbidden literal anywhere
# in the engine module (fails safe: a test or comment literal also reds). Presence properties (LibreOffice
# `-env:UserInstallation=`, pandoc `--sandbox`/`--resource-path`, FFmpeg `-protocol_whitelist`) are plan() tests
# in each module's `argv_contract` test module, pinned by check-sast's argv-contract leg (G29 (b)).
#
# The engine module is the single file `engines/<engine>.rs` plus every file under `engines/<engine>/`, the
# scope the argv-contract leg reads; g24-sast pins each rule's `paths:` key to exactly these two include globs.
# Each fixtures/engines/<engine>.rs pins its literal forms per line: `sast-must-fire` on every planted form,
# `sast-clean` on the hardened sibling's literals. Each fixtures/engines/<engine>/args.rs plants one firing form
# that only the directory glob binds, so a module directory that drops out of the rule's scope reds the canary.
rules:
  - id: convertia-pandoc-unsafe-resource-path
    languages: [rust]
    severity: ERROR
    message: >-
      An absolute or home path literal in the pandoc module; pandoc paths are always the item's
      working directory (§3.5.4). G29 rule (b2), threat T9b.
    metadata:
      convertia-rule: "b2"
      threat: [T9b]
      references: ["build-gates.md G29 (b)"]
    paths:
      include: ["**/engines/pandoc.rs", "**/engines/pandoc/**"]
    # A string literal (plain, or raw `r"`/`r#"`) that opens with a POSIX root `/`, a home `~`, a Windows
    # `%APPDATA%`/`%USERPROFILE%` variable or a drive letter; or with a leading backslash (a rooted, UNC or
    # verbatim Windows path) — escaped as `\\` in a plain literal, bare in a raw one.
    pattern-regex: '(?:\br#*"\\|(?:\br#*)?"(?:/|~|%APPDATA%|%USERPROFILE%|[A-Za-z]:[\\/]|\\\\))'

  - id: convertia-soffice-accept-socket
    languages: [rust]
    severity: ERROR
    message: >-
      An accept-flag literal in the LibreOffice module: the flag opens the UNO loopback socket
      on every machine, and ConvertIA never passes it. G29 rule (b3a), threat T9a/T9b.
    metadata:
      convertia-rule: "b3a"
      threat: [T9a, T9b]
      references: ["build-gates.md G29 (b)"]
    paths:
      include: ["**/engines/libreoffice.rs", "**/engines/libreoffice/**"]
    # soffice reads its options with one or two leading dashes, so both spellings open the socket.
    pattern-regex: '"--?accept'
