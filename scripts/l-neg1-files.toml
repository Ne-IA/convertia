# scripts/l-neg1-files.toml - the L(-1) security-critical-file cage (G71).
#
# Owner decision D1 (security-concept §2): the files that carry the power to silently weaken an
# enforcement plane are the **L(-1) set**. The autonomous Build-Loop NEVER edits one; an owner-
# driven L(-1) edit records an `L-neg1-ack: owner` commit-body trailer, which the G71 pre-push gate
# (scripts/check-l-neg1-ack) mechanically audits.
#
# This file IS the authoritative L(-1) set. security-concept §2, the build-gates G71 row and
# `CLAUDE.md` §5 name its categories and point here; they never enumerate it. It is itself caged
# (`scripts/**`), so the cage cannot be silently narrowed: removing a pattern or adding an escape
# is itself an L(-1) edit that needs the owner-ack trailer.
#
# Patterns are gitignore-style POSIX paths (forward slashes), matched ROOT-ANCHORED against each
# commit's diff file paths (check-l-neg1-ack compiles `^...$`): `*` matches within one path segment,
# `**` matches any depth, `?` one non-`/` char. A root-anchored pattern must name the FULL
# repo-relative path or it silently protects nothing, so check-l-neg1-ack's cage-liveness audit
# fails a pattern that matches no tracked path. A pattern whose target is legitimately absent is
# DECLARED in the gate's AUDIT_DECLARED_TARGETLESS set with its reason; a declaration whose target
# lands, or whose pattern leaves this list, fails the audit too.

patterns = [
  # --- the gate plane: every file under scripts/ ---
  "scripts/**",                   # every present and future file under scripts/ (gates, self-tests, SAST corpus, gate data, this file); the Loop build tools are the [[loop_tool]] escapes
  "tests/g53-fixture/**",         # the G53 negative fixture (a neutered planted-violation = false-green)

  # --- the enforcement-plane config ---
  "lefthook.yml",                 # the L1/L2/L3 git-hook executor
  ".github/**",                   # all CI workflows + composite actions + the G56b allowed-signers file

  # --- supply-chain trust configs ---
  "deny.toml",                    # cargo-deny bans/licenses/advisories
  "audit.toml",                   # cargo-audit advisory-ignore set (G17); reconciled with deny.toml (G18 two-scanner)
  ".npmrc",                       # JS registry pin + install-lifecycle lockdown (G18c/G18d)
  ".editorconfig",                # EOL/charset/final-newline policy enforced by G52 (editorconfig-checker)
  ".typos.toml",                  # G51 prose-typo allowlist (a silently-allowlisted real typo = un-scanned)
  ".yamllint",                    # yamllint YAML-hygiene ruleset for the §6.7.1 Lane-A YAML leg (P1.52.3)
  ".gitleaks.toml",               # gitleaks rules + allowlist (G2)
  ".gitleaks-baseline.json",      # the gitleaks one-time accepted-findings baseline (G2)
  "supply-chain/**",              # cargo-vet exemption set (config.toml) + the committed imports.lock
  ".gitattributes",               # LFS / EOL / merge attributes
  ".lfsconfig",                   # git-LFS endpoint OVERRIDE - optional even under LFS (the default endpoint needs none), so legitimately target-less; declared in AUDIT_DECLARED_TARGETLESS
  "requirements-ci.txt",          # the pip gate-toolchain layer (Semgrep et al.) - reads CI secrets + emits findings (r7, P0.2.14)
  "requirements-yamllint.txt",    # the pip-pinned yamllint linter for the §6.7.1 Lane-A YAML leg (P1.52.3)

  # --- the build artifacts' trust roots ---
  "rust-toolchain.toml",          # the pinned Rust compiler channel (a bump = trusted-build subversion)
  "rustfmt.toml",                 # the Rust format contract (G3); a relaxation weakens the format plane
  "clippy.toml",                  # the Rust lint config (G4/G14); a broad allow weakens the no-panic deny
  "coverage-floors.toml",         # the G27 per-domain coverage-floor ratchet; lowering a floor weakens the coverage plane (increase-only)
  "max_survived_mutants.toml",    # the G15 mutation-testing survived-mutant ratchet (P3.72); raising a count weakens the kernel-test plane (decrease-only)
  "src-tauri/capabilities/**",    # the locked Tauri capabilities / permissions allowlist
  "src-tauri/engines.lock",       # the pinned bundled-engine digests (the §3.7.2 home, landed P4.56.1; patterns are root-anchored, so the path is spelled in full)

  # --- the docs that DEFINE the gates + the process (incl. the reviewer-rubric block) ---
  "docs/security/**",             # security-concept.md + build-gates.md (the Gnn catalogue)
  "docs/process/**",              # build-loop.md / test-strategy.md / roles-and-escalation.md / vuln-response.md / the reviewer rubric
]

# --- Loop-tool escapes: the only uncaged files under scripts/ ---
# Each [[loop_tool]] names one exact path and the reason the Loop builds it. check-l-neg1-ack
# refuses an escape that is nested, carries an extension or has a gate shape (a check-/run-/
# fastpath- name, plan-lint, install-gate-tools, setup-dev, stage-corpus); a refused escape stays
# caged. An escape that is not tracked (dead) or that no pattern cages (orphan) fails the audit
# like a dead glob. Each tool's `--selftest` runs under a caged canary
# (scripts/gate-selftests/g24-<tool>.py) that pins its blessed leg names and drives planted
# positives against the tool from outside, so an edit that neuters a guard reds a caged file.
[[loop_tool]]
path = "scripts/stage-engines"
reason = "§3.3.2 engine staging, Loop-built; its assertion arms carry caged outside planted positives"

[[loop_tool]]
path = "scripts/fetch-engine-assets"
reason = "§6.1.3 engine-asset fetch, Loop-built"

[[loop_tool]]
path = "scripts/compile-engine-asset"
reason = "§6.1.3 from-source compile, Loop-built"
