# scripts/osv-ignores.toml - the accepted advisories of G17's OSV half (scripts/check-osv-advisories, P4.96 and
# push 4): the osv-scanner scan of every committed npm and PyPI lockfile (pnpm-lock.yaml, requirements-ci.txt,
# requirements-yamllint.txt; the census in check-osv-advisories names them) and of the pnpm that package.json's
# `packageManager` pins. The Rust half's accepted advisories live in audit.toml.
#
# An entry accepts ONE advisory that the scan reports:
#
#   [[ignore]]
#   id = "<the OSV id, e.g. a GHSA id, or any of its aliases, e.g. the CVE id>"
#   reason = "<why the advisory does not apply to ConvertIA, or why no fixed version can be taken>"
#   held_by = "<package>@<version>"   # optional: the held package's own pin
#
# `id` and `reason` are required. With `held_by`, the entry accepts the advisory only on that package at that
# version (a PyPI name compared in its PEP 503 normal form): the same advisory on another package or version reds,
# and once the pin moves the entry no longer accepts anything and reds as stale. `held_by` names the vulnerable
# package's pin, never the tool that holds it (plan-lint check 32 keeps the Semgrep version in
# requirements-ci.txt alone). An entry whose advisory the scan no longer reports is stale and fails the check, so
# the list only ever holds live acceptances.
#
# Growth guard: the check fails when this file holds more entries than EXPECTED_IGNORE_COUNT in
# scripts/check-osv-advisories, so accepting an advisory takes two reviewed edits (the entry here, the count
# there). Both files are caged (scripts/**), so the commit carries the G71 `L-neg1-ack: owner` trailer - the
# owner ack, with no per-entry ack field (the audit.toml discipline). This file is the only ignore list: the
# check hands the scanner an empty `--config`, so a committed osv-scanner.toml is never read.

schema_version = 1

