# audit.toml — cargo-audit (RustSec) advisory-ignore config (G17). Authored P1.59. NB cargo-audit does NOT
# auto-read a repo-root audit.toml (its default config path is .cargo/audit.toml) — check-rust-lint-contract's
# live G17 leg READS this file and passes each id to `cargo audit` via `--ignore`. It is ALSO read by
# scripts/check-supply-chain, which asserts this
# [advisories].ignore set is IDENTICAL to deny.toml's (the G18 two-scanner reconciliation — no advisory
# may be silenced in one scanner but live in the other). L(-1) security-critical
# (scripts/l-neg1-files.toml, G71): a silently-added ignore would blind both scanners to a real advisory.
#
# The 8 ids below MIRROR deny.toml [advisories].ignore EXACTLY — keep the two in lock-step. All 8 are what
# `cargo audit` reports as allowed warnings (7 `unmaintained` + 1 `unsound`), NOT vulnerabilities, and PURELY
# TRANSITIVE with no reachable fix in the current dependency tree. The per-id rationale lives in deny.toml;
# re-triage the whole set on any deliberate Tauri/dep bump. Retired 2026-09-24 (the dependency refresh,
# Co-Pilot under owner ack): the ten gtk-rs "unmaintained" ids RUSTSEC-2024-0411..0420 (WITHDRAWN upstream
# 2026-08-14 — gtk-rs unarchived; cargo audit no longer reports them), the quick-xml DoS pair
# RUSTSEC-2026-0194/-0195 (quick-xml moved 0.39.4 → 0.42.0, past the >=0.41 fix) and the rkyv OOB-read
# RUSTSEC-2026-0235 (rust_decimal and its inert optional rkyv left the lock). A vulnerable re-entry is caught by
# cargo-audit's raw-lock scan (cargo-deny reports only compiled dependencies), never re-ignored.
# [Build-Session-Entscheidung: P1.59]

[advisories]
ignore = [
  # glib `unsound` (patched >=0.20.0) — unreachable: the gtk-rs 0.18 line Tauri v2 ships pins glib ^0.18
  # (LINUX-ONLY, transitive via webkit2gtk-4.1). The ten gtk-rs "unmaintained" ids RUSTSEC-2024-0411..0420
  # were WITHDRAWN upstream on 2026-08-14 (gtk-rs unarchived) and retired here 2026-09-24.
  "RUSTSEC-2024-0429",  # glib
  # unmaintained build-time proc-macro + unicode transitive crates
  "RUSTSEC-2024-0370",  # proc-macro-error
  "RUSTSEC-2024-0436",  # paste
  "RUSTSEC-2025-0075",  # unic-char-range
  "RUSTSEC-2025-0080",  # unic-common
  "RUSTSEC-2025-0081",  # unic-char-property
  "RUSTSEC-2025-0098",  # unic-ucd-version
  "RUSTSEC-2025-0100",  # unic-ucd-ident
]
