# .github/workflows/release.yml - Lane B: release-pipeline SKELETON (P0.2.5 - L5 - G58).
#
# Triggered by a v* tag on main (spec sec 6.7.2). This is the empty-but-wired skeleton:
# the L5 acceptance-gate STAGES (matrix build per sec 6.1.4 -> <=400 MB artifact-size
# gate -> SBOM + integrity -> minisign over SHA256SUMS -> build-provenance attestation
# -> GitHub Release publish) are the P0.7 release-gate POLICY, ASSEMBLED in P10. The
# first-step tag-trust assertion (the tagged commit is an ancestor of origin/main AND
# main's required checks were green for that SHA, aborting BEFORE any secret is read)
# is wired in P0.2.9 (G56b).
#
# NO secret is read in this skeleton; the secret-bearing signing job is host-bound +
# token-scoped in P0.2.7 / P0.2.10. DELIBERATELY no `concurrency: cancel-in-progress`
# on a release workflow (a cancelled release is worse than a delayed one). Actions are
# SHA-pinned (G50). This file is L(-1) security-critical (.github/**).

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    name: release-gate-guard
    runs-on: ubuntu-22.04
    timeout-minutes: 18    # 10 for the run + 8 for its slowest retried fetch, the git fetch loop (70 + 300 + 70 s; computed by g24-net-retry.py, build-gates §0)
    steps:
      - name: Checkout (full history, no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0           # full history so the tag-ancestry check has a merge-base
      - name: Fetch origin/main (for the tag-ancestry check)
        # Each try runs under a coreutils `timeout` (git over https sets no stall timeout of its own), and a failed
        # try is retried under the gate plane's one network retry policy (build-gates §0) - the same loop as
        # ci.yml's apt-get step; the step fails CLOSED after the retry window.
        run: |
          delay=2 deadline=
          until timeout -k 10 60 git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main; do
            deadline=${deadline:-$((SECONDS + 300))}
            left=$((deadline - SECONDS))
            if [ "$left" -le 0 ]; then echo "::error::git fetch of origin/main failed through its retry window"; exit 1; fi
            pause=$((delay / 2 + RANDOM % (delay / 2 + 1)))
            if [ "$pause" -gt "$left" ]; then pause=$left; fi
            echo "::warning::git fetch of origin/main failed; retrying in ${pause}s"
            sleep "$pause"
            delay=$((delay * 2 < 60 ? delay * 2 : 60))
          done
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: 'G56b: release-tag trust gate (ancestry + green-history + signed-tag); aborts BEFORE any secret'
        env:
          GH_TOKEN: ${{ github.token }}   # github.token, NOT a release secret - guard runs pre-secret
        run: python3 -P scripts/check-release-tag-trust
      - name: Fail-closed until the Lane-B pipeline is assembled (P10)
        run: |
          echo "The Lane-B release pipeline (build / size / SBOM / minisign / attest /"
          echo "publish) is assembled in P10. The G56b tag-trust gate above has run; this"
          echo "skeleton then REJECTS fail-closed so a release can never hollow-succeed"
          echo "before the real acceptance gates exist."
          exit 1
