# Cargo.toml — the ConvertIA Rust WORKSPACE root (virtual manifest).
#
# [Build-Session-Entscheidung: P1.6] spec §0.7 leaves the workspace manifest "root or member" open;
# resolved to a REPO-ROOT VIRTUAL manifest — the conventional Cargo layout for a multi-crate
# workspace, giving all members one root + one committed Cargo.lock (§3.8 pin-everything, G18a):
#   * src-tauri/        — the MIT core crate `convertia-core` (the Tauri host binary, G53-policed)
#   * crates/imgworker/ — the isolated libvips/libheif/librsvg image-worker externalBin
#                         (pkg `convertia-imgworker`, §0.9/§2.12/§3.5.5); links the §3.6.1 copyleft
#                         C libs by AGGREGATION, never into the MIT core (G53). Its dir is `crates/
#                         imgworker/` because the G29 allow-list pins the FFI module at
#                         `crates/imgworker/src/ffi.rs`.
#   * xtask/            — the `cargo xtask` dev-bin (§0.4.5 codegen + §6.7.1 coverage, G19)
# tests/g53-fixture/ is the G53 NEGATIVE fixture (its own nested [workspace]); excluded so its
# deliberate planted copyleft-into-core violation can never enter the real workspace graph.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/imgworker", "xtask"]
exclude = ["tests/g53-fixture"]

# Shared package metadata inherited by every member (`version.workspace = true`, …). The exact patch
# versions of dependencies are pinned in Cargo.lock + the SBOM, not here (spec §0.8 "pin everything").
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"
license = "MIT"
repository = "https://github.com/Ne-IA/convertia"
authors = ["Ne-IA and ConvertIA contributors"]

# The §0.8 relied-upon floors: the minimum version ConvertIA's own code relies on for each load-bearing
# crate. check-supply-chain (G18) fails when a floored crate is absent from Cargo.lock or resolves below its
# floor; the commit that adds such a dependency adds its row here. Raising a floor is ordinary work; lowering
# or removing a row needs `L-neg1-ack: owner` (G71's monotone rule, scripts/l-neg1-files.toml). Cargo ignores
# this table. Floors compare by semver precedence (2.0.0 > 2.0.0-rc.25 > 2.0.0-rc.2).
[workspace.metadata.convertia.pinned-floors]
tauri-specta = "2.0.0-rc.25"   # §0.4.5 IPC codegen (the bindings.ts surface)
specta = "2.0.0-rc.25"         # §0.4.5 type introspection (coupled to tauri-specta)
walkdir = "2.5.0"              # §1.1 recursive intake
tempfile = "3.27.0"            # §0.8 owned-scratch atomic write
proptest = "1.11.0"            # §6.4.2 Rust property-test library (dev-only; a floor is keyed by crate)
tokio-util = "0.7.18"          # §0.4.4/§1.7 CancellationToken
tokio = "1.52.3"               # §0.9/§1.7 Semaphore and the spawn_blocking permit lane
dunce = "1.0.5"                # §2.3.1 \\?\-prefix display normalisation
winapi-util = "0.1.11"         # §2.3.1 Windows file identity (safe GetFileInformationByHandle wrapper)
rustix = "1.1.4"               # §2.1.1/§2.1.2 Unix publish primitives (renameat_with NOREPLACE, linkat, fstatvfs)
windows-sys = "0.61.2"         # §2.1.2 Windows no-replace move (FileRenameInfoEx class) and GetDiskFreeSpaceExW
chardetng = "1.0.0"            # §1.2 text-encoding detection
encoding_rs = "0.8.35"         # §1.2 Encoding vocabulary (for_bom, name)
csv = "1.4.0"                  # §3.5.6 native CSV/TSV RFC-4180 reader/writer
process-wrap = "9.1.0"         # §1.7 process-group / Job-Object spawn and group kill
landlock = "0.4.5"             # §2.12.3 Linux Landlock fs-restrict leg
seccompiler = "0.5.0"          # §2.12.3 Linux seccomp-bpf exec-deny leg
libc = "0.2.186"               # §2.12.3 Linux syscall numbers and net-ns syscalls, §1.10 macOS memory read
toml = "1.1.2"                 # §2.12.4 Cargo.lock closure-walk parser (dev-only)
